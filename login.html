<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKYLine Travels | Premium Access Portal</title>
 
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-glow: #0072ff;
            --secondary-glow: #00c6ff;
            --glass-bg: rgba(255, 255, 255, 0.06);
            --glass-border: rgba(255, 255, 255, 0.12);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0b0f19;
            min-height: 100vh;
            display: flex;
            flex-column: column;
            background-image: linear-gradient(to bottom, rgba(11, 15, 25, 0.7), rgba(11, 15, 25, 0.95)), url('flight1.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            overflow-x: hidden;
        }


        .navbar-custom {
            background: rgba(15, 23, 42, 0.65) !important;
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            width: 100%;
        }
        
        .navbar-brand h1 {
            font-weight: 700;
            font-size: 1.6rem;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #fff 30%, var(--secondary-glow));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-link-custom {
            color: rgba(255, 255, 255, 0.85) !important;
            font-size: 1.05rem !important;
            font-weight: 500;
            position: relative;
            padding: 0.5rem 0;
            transition: color 0.3s ease;
        }

        .nav-link-custom:hover { color: #fff !important; }

        .nav-link-custom::after {
            content: ''; position: absolute; width: 100%; transform: scaleX(0); height: 2px;
            bottom: 0; left: 0; background: linear-gradient(90deg, var(--primary-glow), var(--secondary-glow));
            transform-origin: bottom right; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .nav-link-custom:hover::after {
            transform: scaleX(1); transform-origin: bottom left;
        }

        .btn-signup-premium {
            color: #fff !important;
            border: 1px solid rgba(0, 198, 255, 0.4) !important;
            background: rgba(0, 114, 255, 0.05);
            font-size: 0.95rem; font-weight: 500;
            transition: all 0.3s ease !important;
        }

        .btn-signup-premium:hover {
            background: linear-gradient(135deg, rgba(0, 114, 255, 0.2), rgba(0, 198, 255, 0.2)) !important;
            border-color: #00c6ff !important;
            box-shadow: 0 0 15px rgba(0, 198, 255, 0.3);
            transform: translateY(-1px);
        }


        .auth-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
        }

        .auth-card {
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 28px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 450px;
        }

        .brand-title {
            font-weight: 700;
            background: linear-gradient(135deg, #fff 40%, var(--secondary-glow));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .form-control {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff !important;
            border-radius: 12px;
            padding: 12px 16px;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            background: rgba(15, 23, 42, 0.75);
            border-color: var(--secondary-glow);
            box-shadow: 0 0 0 4px rgba(0, 198, 255, 0.15);
        }

        .form-control::placeholder { color: rgba(255, 255, 255, 0.35); }

        .form-check-input {
            background-color: rgba(15, 23, 42, 0.5);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .form-check-input:checked {
            background-color: var(--primary-glow);
            border-color: var(--primary-glow);
        }

        .btn-auth-premium {
            background: linear-gradient(135deg, var(--primary-glow), var(--secondary-glow));
            border: none;
            color: white;
            font-weight: 600;
            border-radius: 12px;
            padding: 13px;
            letter-spacing: 0.5px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 20px rgba(0, 114, 255, 0.25);
        }

        .btn-auth-premium:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(0, 198, 255, 0.4);
        }

        .auth-link {
            color: var(--secondary-glow);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .auth-link:hover {
            color: #fff;
            text-decoration: underline;
        }
    </style>
</head>
<body class="d-flex flex-column">


<nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top py-3">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center" href="index.html">
      <img src="LOGO.png" alt="Logo" width="50" height="50" class="d-inline-block align-text-top me-3">
      <h1 class="m-0">SKYLine Travels</h1>
    </a>
    
    <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto gap-4"> 
        <li class="nav-item"><a class="nav-link nav-link-custom" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link nav-link-custom" href="about.html">About</a></li>
        <li class="nav-item"><a class="nav-link nav-link-custom" href="contact.html">Contact</a></li>
        <li class="nav-item"><a class="nav-link nav-link-custom active" href="login.html">Login</a></li>
        <li class="nav-item"><a class="nav-link btn btn-signup-premium px-4 rounded-pill ms-2" href="signup.html">SignUp</a></li>
      </ul>
    </div>
  </div>
</nav>


<div class="auth-container">
    <div class="card auth-card p-4 p-sm-5 shadow-lg">
        <div class="text-center mb-4">
            <h2 class="brand-title h3 mb-1">Welcome Back</h2>
            <p class="text-white-50 small">Secure user gate for private itinerary indices</p>
        </div>

        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label text-white-50 small fw-bold text-uppercase tracking-wider">Email Address</label>
                <input type="email" class="form-control" placeholder="name@example.com" required autocomplete="email">
            </div>

            <div class="mb-3">
                <div class="d-flex justify-content-between align-items-center mb-1">
                    <label class="form-label text-white-50 small fw-bold text-uppercase tracking-wider mb-0">Password</label>
                    <a href="#" class="small auth-link">Forgot?</a>
                </div>
                <input type="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
            </div>

            <div class="mb-4 form-check">
                <input type="checkbox" class="form-check-input" id="rememberMe">
                <label class="form-check-label text-white-50 small" for="rememberMe">Keep me logged in</label>
            </div>

            <button type="submit" class="btn btn-auth-premium w-100 mb-3">Secure Login</button>
            
            <div class="text-center mt-3">
                <p class="text-white-50 small mb-0">Don't have an account? <a href="signup.html" class="auth-link">Create Account</a></p>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        alert('🔒 Verification success! Synchronizing passenger portal profiles upstream...');
    });
</script>
</body>
</html>
